plugins {
    id 'maven-publish'
    id 'com.enonic.defaults' version '2.1.7'
    id 'com.enonic.xp.app'
    id "com.github.node-gradle.node" version '7.1.0'
}

node {
    download = true
    version = '16.10.0'
}

dependencies {
    implementation xplibs.api.core
    implementation xplibs.api.portal
    include xplibs.admin
    include xplibs.auth
    include xplibs.content
    include xplibs.context
    include xplibs.io
    include xplibs.node
    include xplibs.portal
    include xplibs.repo
    include xplibs.value
    include xplibs.websocket
    include xplibs.event
    include xplibs.task
    include xplibs.mail
    include libs.lib.router
    include libs.lib.thymeleaf
    include libs.lib.mustache
    include libs.lib.http.client
    include libs.lib.graphql
    include libs.lib.geoip
    include libs.lib.text.encoding
    include libs.lib.notifications
    include libs.lib.asset

    testImplementation "com.enonic.xp:testing:${xpVersion}"
    testImplementation libs.junit.jupiter
    testImplementation libs.mockito.core
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly libs.graalvm.js
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo()
    xp.enonicRepo("dev")
}

test {
    useJUnitPlatform()
}

def testGraalJs = tasks.register('testGraalJs', Test) {
    group = 'verification'
    description = 'Runs tests with the GraalJS script engine.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'xp.script-engine', 'GraalJS'
    shouldRunAfter test
}

check.dependsOn testGraalJs

tasks.register('webpackBuild', NpmTask) {
    dependsOn npmInstall
    args = ['run', 'build:aot']
}

jar.dependsOn webpackBuild
